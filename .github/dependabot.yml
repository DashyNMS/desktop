# Everything is pinned (actions by commit, packages by version), so nothing
# moves unless Dependabot proposes it. Minor and patch updates are grouped;
# majors come one at a time.
version: 2

# DashyNMS.Core comes from GitHub Packages, which needs a login. The token is
# a Dependabot secret (Settings > Secrets and variables > Dependabot):
# DASHYNMS_PACKAGES_TOKEN, a classic token with read:packages only.
registries:
  dashynms:
    type: nuget-feed
    url: https://nuget.pkg.github.com/DashyNMS/index.json
    username: dependabot
    password: ${{secrets.DASHYNMS_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    registries:
      - dashynms
    ignore:
      # Pinned by hand to an edge package of DashyNMS/core between releases
      # (see docs/DEVELOPMENT.md), not bumped on every commit there.
      - dependency-name: "DashyNMS.*"
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]
