name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag at this master commit (vX.Y.Z)'
        type: string
        required: true

concurrency:
  group: release-build-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  dispatch:
    if: github.event_name == 'release' && github.event.release.prerelease == false && github.repository == 'DashyNMS/desktop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run signing from the protected master branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run release-build.yml --repo DashyNMS/desktop --ref master -f tag="$RELEASE_TAG"
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'DashyNMS/desktop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require a published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --repo DashyNMS/desktop --json isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'A published stable release is required.' }
      - name: Validate stable version and source commit
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./tools/Prepare-ReleaseWorkflow.ps1 -Tag $env:RELEASE_TAG
  packages:
    needs: prepare
    uses: ./.github/workflows/package-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_commit: ${{ needs.prepare.outputs.commit }}
      distribution: true
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'DashyNMS/desktop'
    needs: [prepare, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify every release asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: ./tools/Test-PreviewArtifacts.ps1 -Directory dist -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT
      - name: Attach verified installers to the published release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/DashyNMS-Setup-${{ needs.prepare.outputs.version }}.exe
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-osx-x64.dmg
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-osx-arm64.dmg
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-linux-arm64.AppImage
