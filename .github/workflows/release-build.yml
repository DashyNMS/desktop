name: Release build

# Fires when a GitHub Release is published (draft it and write the notes in
# the web UI as usual, tagged vX.Y.Z) and attaches the built installer to it.
# Skips a release published with "Set as a pre-release" ticked - that's what
# the preview-build workflow already produces and attaches its own installer
# to, so there is nothing for this workflow to add.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

# DashyNMS.Core comes from GitHub Packages (see nuget.config).
env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: windows-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Work out the version from the release tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Checkout the pinned MCP server
        uses: actions/checkout@v7
        with:
          repository: DashyNMS/mcp
          # Includes permission to bundle the server with DashyNMS.
          ref: 0e8af47aff23f242c722e3962b28ccac148a9f61
          path: artifacts/mcp-source
          submodules: recursive
          persist-credentials: false

      - name: Publish the bundled network tools
        shell: pwsh
        run: ./tools/Publish-Mcp.ps1 -Source artifacts/mcp-source -Runtime win-x64

      - name: Publish
        run: dotnet publish src/DesktopNMS.Avalonia/DesktopNMS.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Verify the bundled network tools
        shell: pwsh
        run: |
          foreach ($file in @('dashynms-mcp.exe', 'LICENSE', 'BUILD.txt')) {
            if (-not (Test-Path "publish/mcp/$file" -PathType Leaf)) {
              throw "Published app is missing mcp/$file."
            }
          }

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\DashyNMS.iss

      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          # Attach only the app download, never build records or checksum sidecars.
          files: dist/DashyNMS-Setup-${{ steps.version.outputs.version }}.exe
