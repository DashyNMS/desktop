name: Release build

# Publishing a GitHub release (tag v<version>, on main's newest commit) builds
# it. The release goes back to being a draft while that happens, and is
# published again when everything in it is ready. If a build fails it stays a
# draft: fix it, then run this by hand with the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-build-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  hold:
    name: Hold the release
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'DashyNMS/desktop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Make it a draft and build it from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --draft
          gh workflow run release-build.yml --ref main -f tag="$TAG"

  version:
    name: Version
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'DashyNMS/desktop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/build_version.py release --tag "$TAG"

  # What the release says is what the app shows as What's New.
  notes:
    name: Release notes
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write # a draft is only readable with this
    steps:
      - name: Read the release's notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q '^## ' notes.md; then
            echo "::error::Write the release's notes first, under ## headings."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          retention-days: 14

  ci:
    name: CI
    needs: [version, notes]
    uses: ./.github/workflows/ci.yml

  packages:
    name: Packages
    needs: [version, notes, ci]
    uses: ./.github/workflows/packages.yml
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      version: ${{ needs.version.outputs.version }}
      commit: ${{ needs.version.outputs.commit }}
      sign: true
      notes: true

  publish:
    name: Publish
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify every package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: ./scripts/Test-ReleaseArtifacts.ps1 -Directory dist -Version $env:VERSION -Commit $env:COMMIT
      # Build records and checksums stay in the Actions artifacts.
      - name: Attach the installers and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.exe dist/*.dmg dist/*.AppImage --clobber
          gh release edit "$TAG" --draft=false --latest

  sentry:
    name: Sentry
    needs: [version, publish]
    uses: ./.github/workflows/sentry.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      tag: ${{ needs.version.outputs.tag }}
