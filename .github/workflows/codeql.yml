name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 03:17 UTC every Monday - an off-peak, deliberately non-round time.
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

# DashyNMS.Core comes from GitHub Packages (see nuget.config).
env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  analyze:
    # Include the Windows notification adapter in the real build CodeQL analyses.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build
        run: dotnet build DesktopNMS.sln -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
