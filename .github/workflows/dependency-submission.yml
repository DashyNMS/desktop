name: Dependency submission

# Sends the full NuGet dependency tree (including DashyNMS.Core from GitHub
# Packages) to the dependency graph, so Dependabot alerts cover transitive
# packages. Replaces GitHub's automatic dependency submission, which can't
# log in to GitHub Packages - turn that off in Settings > Advanced Security.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  submit:
    name: Submit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # project.assets.json is what component detection reads.
      - name: Restore
        run: dotnet restore DashyNMS.Desktop.slnx
      - name: Submit to the dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52 # v0.2.1
        with:
          detectorsCategories: NuGet
