name: CI

# Every pull request. Edge, nightly and release builds call it too, so nothing
# is published from a commit that hasn't passed. "CI result" is the required
# check; CodeQL is separate, so a slow scan never holds up a merge.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# DashyNMS.Core comes from GitHub Packages (see nuget.config).
env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DASHYNMS_SENTRY_DSN: ${{ vars.SENTRY_DSN }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The .NET 9 runtime as well, which the app targets.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build DashyNMS.Desktop.slnx -c Debug

      - name: Test
        run: dotnet test tests/DesktopNMS.Presentation.Tests -c Debug --no-build

      - name: Test UI input routing
        run: dotnet test tests/DesktopNMS.Avalonia.Tests -c Debug --no-build

      - name: Verify the embedded release notes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-BundledReleaseNotes.ps1

      - name: Verify fatal-error persistence and restart delivery
        run: dotnet run --project tools/CrashReportingProbe -c Release

      - name: Verify session health across clean exit, managed crash and forced termination
        run: dotnet run --project tools/SessionHealthProbe -c Release

      - name: Compile the macOS notification bridge and login-item helper
        if: runner.os == 'macOS'
        run: |
          swiftc -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13" -emit-library scripts/macos/Notifications.swift -o "$RUNNER_TEMP/libdashynms-notifications.dylib"
          swiftc scripts/macos/LoginItem.swift -o "$RUNNER_TEMP/dashynms-login"

  scripts:
    name: Build scripts and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the build and guide scripts
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Check this version's release notes
        run: python3 scripts/build_version.py check
      - name: Test the signing policy and release gates
        shell: pwsh
        run: |
          ./scripts/Test-MacOSWorkflow.ps1
          ./scripts/Test-ReleaseArtifactsGate.ps1
          ./scripts/macos/Test-Distribution.ps1

  web-sign-in-browser:
    name: Sign-in browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libsoup-3.0-0
      - name: Exercise the native browser
        if: runner.os != 'Linux'
        run: dotnet run --project tools/WebSignInSmoke
      - name: Exercise the Linux native browser
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project tools/WebSignInSmoke

  macos-update:
    name: macOS update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the shipping updater
        run: swiftc -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13" scripts/macos/Update.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker scripts/macos/UpdateInfo.plist -o "$RUNNER_TEMP/dashynms-update"
      - name: Test native replacement and recovery
        run: |
          swiftc -swift-version 5 -D UPDATE_TESTS -parse-as-library scripts/macos/Update.swift scripts/macos/UpdateTests.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker scripts/macos/UpdateInfo.plist -o "$RUNNER_TEMP/update-tests"
          "$RUNNER_TEMP/update-tests"

  result:
    name: CI result
    if: always()
    needs: [test, scripts, web-sign-in-browser, macos-update]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
