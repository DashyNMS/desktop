name: Build and test

# The required status check for master: every PR (yours or a contributor's)
# has to build and pass tests before it can merge. Kept separate from
# codeql.yml so a security-scan slowdown or finding never blocks a plain
# merge gate.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

# DashyNMS.Core comes from GitHub Packages (see nuget.config).
env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DASHYNMS_SENTRY_DSN: ${{ vars.SENTRY_DSN }}

jobs:
  web-sign-in-browser:
    name: Sign-in browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libsoup-3.0-0
      - name: Exercise the native browser
        if: runner.os != 'Linux'
        run: dotnet run --project tools/WebSignInSmoke
      - name: Exercise the Linux native browser
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project tools/WebSignInSmoke

  macos-update:
    name: macOS update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Compile the shipping updater
        run: swiftc -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13" tools/macos/Update.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker tools/macos/UpdateInfo.plist -o "$RUNNER_TEMP/dashynms-update"
      - name: Test native replacement and recovery
        run: |
          swiftc -swift-version 5 -D UPDATE_TESTS -parse-as-library tools/macos/Update.swift tools/macos/UpdateTests.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker tools/macos/UpdateInfo.plist -o "$RUNNER_TEMP/update-tests"
          "$RUNNER_TEMP/update-tests"

  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build DesktopNMS.sln -c Debug

      - name: Test
        run: dotnet test tests/DesktopNMS.Presentation.Tests -c Debug --no-build

      - name: Test UI input routing
        run: dotnet test tests/DesktopNMS.Avalonia.Tests -c Debug --no-build

      - name: Verify exact embedded release notes
        shell: pwsh
        run: ./tools/Test-BundledReleaseNotes.ps1

      - name: Verify fatal-error persistence and restart delivery
        run: dotnet run --project tools/CrashReportingProbe -c Release

      - name: Verify session health across clean exit, managed crash and forced termination
        run: dotnet run --project tools/SessionHealthProbe -c Release

  # The cross-platform app (#153) and the shared projects it brings in build
  # on macOS and Linux too. Windows builds it above, with the solution.
  avalonia:
    name: Avalonia (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build src/DesktopNMS.Avalonia -c Debug

      - name: Test
        run: dotnet test tests/DesktopNMS.Presentation.Tests -c Debug

      - name: Test UI input routing
        run: dotnet test tests/DesktopNMS.Avalonia.Tests -c Debug

      - name: Verify fatal-error persistence and restart delivery
        run: dotnet run --project tools/CrashReportingProbe -c Release

      - name: Verify session health across clean exit, managed crash and forced termination
        run: dotnet run --project tools/SessionHealthProbe -c Release

      - name: Compile the macOS notification bridge
        if: runner.os == 'macOS'
        run: swiftc -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13" -emit-library tools/macos/Notifications.swift -o "$RUNNER_TEMP/libdashynms-notifications.dylib"
      - name: Compile the macOS login-item helper
        if: runner.os == 'macOS'
        run: swiftc tools/macos/LoginItem.swift -o "$RUNNER_TEMP/dashynms-login"
