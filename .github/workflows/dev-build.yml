name: Development build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Select an isolated development package version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          "value=$($props.Project.PropertyGroup.Version)-preview.pr.${{ github.event.number || 0 }}.${{ github.run_number }}.${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
  packages:
    needs: prepare
    uses: ./.github/workflows/package-build.yml
    with:
      source_commit: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.version }}
      distribution: false
      retention_days: 7
