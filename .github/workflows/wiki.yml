name: User guide wiki

# The user guide is written in docs/guide, where it's reviewed with the code
# it describes, and copied to the repository wiki for people to read (#257).
# Pull requests only check that every link in the guide resolves.
on:
  push:
    branches: [master]
    paths:
      - docs/guide/**
      - tools/Publish-WikiGuide.py
      - tools/tests/test_publish_wiki_guide.py
      - .github/workflows/wiki.yml
  pull_request:
    branches: [master]
    paths:
      - docs/guide/**
      - tools/Publish-WikiGuide.py
      - tools/tests/test_publish_wiki_guide.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  check:
    name: Check the guide's links
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test wiki publishing
        run: python3 -B -m unittest discover -s tools/tests -v
      - name: Convert to wiki pages
        run: python3 tools/Publish-WikiGuide.py docs/guide "$RUNNER_TEMP/wiki" --repository "$GITHUB_REPOSITORY"

  publish:
    name: Publish to the wiki
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Pushing to the wiki's own Git repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The wiki has a Git repository only once it's turned on in the
      # repository settings and has a first page, so until then this stops
      # with a notice rather than failing.
      - name: Clone the wiki
        id: clone
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The wiki isn't available yet. Turn it on under Settings, Features, Wikis, create any first page, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert to wiki pages
        if: steps.clone.outputs.ready == 'true'
        run: python3 tools/Publish-WikiGuide.py docs/guide "$RUNNER_TEMP/wiki" --repository "$GITHUB_REPOSITORY" --branch master

      - name: Push the changes
        if: steps.clone.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches the guide."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: update the user guide from ${GITHUB_SHA::7}"
          git push
