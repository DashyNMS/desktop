name: Preview build

# Manual only: preparing or merging this workflow never publishes a preview.
on:
  workflow_dispatch:

concurrency:
  group: preview-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    if: github.repository == 'DashyNMS/desktop' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.preview.outputs.version }}
      tag: ${{ steps.preview.outputs.tag }}
      commit: ${{ steps.preview.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Test preview release gates
        shell: pwsh
        run: ./tools/Test-PreviewWorkflow.ps1
      - name: Require release notes and select the next preview
        id: preview
        shell: pwsh
        run: ./tools/Prepare-Preview.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: preview-notes
          path: artifacts/preview/release-notes.md
          if-no-files-found: error
          retention-days: 30
  packages:
    needs: prepare
    uses: ./.github/workflows/package-build.yml
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_commit: ${{ needs.prepare.outputs.commit }}
      distribution: true
  publish:
    if: github.repository == 'DashyNMS/desktop' && github.ref == 'refs/heads/master'
    needs: [prepare, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: preview-notes
          path: notes
      - name: Verify every release asset
        shell: pwsh
        env:
          PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
          PREVIEW_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: ./tools/Test-PreviewArtifacts.ps1 -Directory dist -Version $env:PREVIEW_VERSION -Commit $env:PREVIEW_COMMIT
      - name: Tag the verified commit
        shell: pwsh
        env:
          PREVIEW_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIEW_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git tag $env:PREVIEW_TAG $env:PREVIEW_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the preview tag.' }
          git push origin $env:PREVIEW_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the preview tag; no release was published.' }
      - name: Publish the verified preview
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: notes/release-notes.md
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          # Build records and checksum sidecars stay in Actions artifacts.
          files: |
            dist/DashyNMS-Setup-${{ needs.prepare.outputs.version }}.exe
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-osx-x64.dmg
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-osx-arm64.dmg
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
            dist/DashyNMS-${{ needs.prepare.outputs.version }}-linux-arm64.AppImage
  sentry:
    needs: [prepare, publish]
    uses: ./.github/workflows/sentry-release.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      tag: ${{ needs.prepare.outputs.tag }}
