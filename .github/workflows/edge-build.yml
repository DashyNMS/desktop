name: Edge build

# Every commit to main: <version>-edge.<build>. By hand to make another of the
# same commit, for example after a failed publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One at a time, in order, so a later commit's files are never replaced by an earlier one's.
concurrency:
  group: edge-build
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Version
    if: github.repository == 'DashyNMS/desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        run: python3 scripts/build_version.py edge

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  packages:
    name: Packages
    needs: [version, ci]
    uses: ./.github/workflows/packages.yml
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    with:
      version: ${{ needs.version.outputs.version }}
      commit: ${{ needs.version.outputs.commit }}
      sign: true

  publish:
    name: Publish
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify every package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: ./scripts/Test-ReleaseArtifacts.ps1 -Directory dist -Version $env:VERSION -Commit $env:COMMIT
      # Build records and checksums stay in the Actions artifacts.
      - name: Publish on the edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: scripts/publish-edge.sh "$VERSION" "$COMMIT" dist/*.exe dist/*.dmg dist/*.AppImage
